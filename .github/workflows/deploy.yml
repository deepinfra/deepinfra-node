name: Publish NPM Package

on:
  release:
    types: [created]
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC)

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # npm stage publish needs npm >= 11.15.0; current Node 24 bundles it.
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run test
      - run: npm run build
      # A maintainer approves the staged version (RELEASE.MD). npm logs
      # trusted-publishing errors only at verbose level.
      - run: npm stage publish --access=public --loglevel=verbose

